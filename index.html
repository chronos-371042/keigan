<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<meta name='description' content='顧問探偵・黒樫慧の鑑定室。植物病理、数学、化学、物理、史学を一つの消去法で扱う。'>
<title>慧眼 — 顧問探偵 黒樫慧</title>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=Shippori+Mincho:wght@500;600;700&display=swap' rel='stylesheet'>
<style>
:root {
  --ink:#140e0a; --ink-soft:#2a2118; --paper:#f4efe4; --paper-deep:#e7dcc8;
  --brass:#a67c3d; --brass-bright:#e0c48a; --oxblood:#7a2e2a;
  --sap:#3e5c45; --ver:#3d6b66; --steel:#3d4f66; --indigo:#2c3354; --char:#8a8175;
  --muted:#8d8376;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0; color:var(--paper);
  font-family:'IBM Plex Sans JP', sans-serif;
  background:
    radial-gradient(900px 420px at 0% -10%, rgba(224,196,138,.09), transparent 55%),
    linear-gradient(180deg, #1c1510 0%, var(--ink) 280px);
  min-height:100vh;
}
button, input, textarea, select { font-family:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--brass-bright); outline-offset:3px; }
.skip { position:absolute; left:-999px; top:8px; background:var(--paper); color:var(--ink); padding:8px 12px; z-index:9; }
.skip:focus { left:12px; }
.top {
  display:flex; align-items:center; gap:22px; padding:16px 28px;
  border-bottom:1px solid rgba(224,196,138,.22);
  position:sticky; top:0; z-index:5;
  background:rgba(20,14,10,.9); backdrop-filter:blur(10px);
}
.brand { display:flex; align-items:center; gap:10px; color:var(--paper); text-decoration:none; }
.brand strong { font-family:'Shippori Mincho', serif; font-weight:600; letter-spacing:.18em; font-size:20px; }
.brand small { display:block; letter-spacing:.22em; color:var(--brass-bright); font-size:10px; font-weight:500; }
.mark { width:28px; height:28px; }
nav { display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }
nav a {
  color:var(--paper-deep); text-decoration:none; font-size:13px; letter-spacing:.12em;
  padding:8px 10px; border-bottom:1px solid transparent;
}
nav a[aria-current='page'] { color:var(--brass-bright); border-bottom-color:var(--brass); }
main { max-width:1120px; margin:0 auto; padding:34px 22px 72px; }
.hero { display:flex; gap:22px; align-items:flex-start; padding:18px 0 10px; }
.vlabel { writing-mode:vertical-rl; letter-spacing:.45em; color:var(--brass-bright); font-size:12px; padding-top:8px; }
h1 {
  font-family:'Shippori Mincho', serif; font-weight:600;
  font-size:clamp(72px, 13vw, 148px); line-height:.86; margin:0; letter-spacing:.06em;
}
.en { margin:10px 0 0; letter-spacing:.42em; font-size:12px; color:var(--brass); }
.lead { max-width:40rem; font-size:17px; line-height:1.85; color:var(--paper-deep); }
.ruby { font-size:18px; letter-spacing:.08em; }
ruby rt { font-size:10px; letter-spacing:.04em; color:var(--brass-bright); }
.actions { display:flex; gap:12px; flex-wrap:wrap; margin:22px 0; }
.btn, button.btn {
  appearance:none; border:1px solid var(--brass); background:transparent; color:var(--brass-bright);
  padding:12px 18px; letter-spacing:.14em; text-decoration:none; cursor:pointer; font-size:13px;
}
.btn.solid { background:var(--brass); color:#1a120c; border-color:var(--brass); }
.btn.ink { background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btn:hover { background:rgba(224,196,138,.12); }
.btn.solid:hover { background:#c4a15a; }
.obs { margin-top:28px; border-top:1px solid rgba(224,196,138,.25); }
.obs h2, .sec h2 { font-family:'Shippori Mincho', serif; font-weight:600; font-size:22px; letter-spacing:.08em; }
.obs li { margin:8px 0; line-height:1.7; color:var(--paper-deep); }
.legend { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.legend a, .chip {
  text-decoration:none; border:1px solid currentColor; padding:4px 9px; font-size:12px; letter-spacing:.08em;
}
.sap { color:#b7cbb8; } .ver { color:#b7d0cc; } .steel { color:#c5d0df; }
.indigo { color:#c9cde2; } .blood { color:#e3b2af; } .char { color:#d5cfc6; } .brass { color:var(--brass-bright); }
.paper .sap { color:var(--sap); } .paper .ver { color:var(--ver); } .paper .steel { color:var(--steel); }
.paper .indigo { color:var(--indigo); } .paper .blood { color:var(--oxblood); } .paper .char { color:#5c564e; } .paper .brass { color:#7a5a28; }
.foot { max-width:1120px; margin:0 auto; padding:18px 22px 36px; color:var(--muted); font-size:12px; line-height:1.7; border-top:1px solid rgba(224,196,138,.15); }
.consult, .split { display:grid; grid-template-columns:minmax(250px,340px) 1fr; gap:26px; align-items:start; }
label { display:block; font-size:12px; letter-spacing:.16em; color:var(--brass-bright); margin-bottom:8px; }
textarea, input[type='search'], input[type='text'], select {
  width:100%; background:#100c09; border:1px solid rgba(224,196,138,.35); padding:12px; color:var(--paper);
  font-size:15px; line-height:1.6;
}
textarea { min-height:180px; resize:vertical; }
.slips { display:flex; flex-direction:column; gap:8px; margin:14px 0; }
.slips button, .textbtn {
  text-align:left; background:#1c1612; border:1px solid rgba(224,196,138,.2); color:var(--paper-deep);
  padding:10px 12px; cursor:pointer; line-height:1.55; font-size:13px;
}
.slips button:hover, .textbtn:hover { border-color:var(--brass); }
.paper {
  background:var(--paper); color:var(--ink);
  padding:32px 34px 28px;
  box-shadow:0 24px 70px rgba(0,0,0,.35);
}
.paper h2, .paper h3 { font-family:'Shippori Mincho', serif; font-weight:600; letter-spacing:.06em; }
.paper h2 { font-size:30px; margin:0 0 6px; }
.paper h3 { font-size:18px; margin:0 0 8px; }
.paper p, .paper li { line-height:1.85; }
.kicker { letter-spacing:.2em; font-size:11px; color:var(--oxblood); margin:0 0 8px; }
.lbl { font-size:11px; letter-spacing:.18em; color:var(--oxblood); margin:16px 0 6px; }
.seal {
  float:right; width:58px; height:58px; border:1px solid var(--oxblood); border-radius:50%;
  display:grid; place-items:center; color:var(--oxblood);
  font-family:'Shippori Mincho', serif; letter-spacing:.08em;
}
.meta { color:#5e564c; font-size:13px; }
.bar { height:3px; background:#e4d8c4; margin-top:6px; }
.bar i { display:block; height:100%; background:#a67c3d; }
hyp, .hyp { margin:0 0 14px; padding-bottom:10px; border-bottom:1px solid rgba(20,14,10,.08); }
.rowitem {
  display:grid; grid-template-columns:92px 1fr auto; gap:14px; align-items:baseline;
  padding:14px 0; border-bottom:1px solid rgba(224,196,138,.18); color:inherit; text-decoration:none;
}
.rowitem strong { font-family:'Shippori Mincho', serif; font-weight:600; font-size:20px; letter-spacing:.04em; }
.rowitem span, .when { color:var(--muted); font-size:12px; letter-spacing:.08em; }
.filters { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 18px; }
.filters button { background:transparent; border:1px solid rgba(224,196,138,.3); color:var(--paper-deep); padding:6px 10px; cursor:pointer; letter-spacing:.08em; font-size:12px; }
.filters button[aria-pressed='true'] { border-color:var(--brass-bright); color:var(--brass-bright); }
.cardlist { display:flex; flex-direction:column; gap:8px; }
.clue { background:#1c1612; border:1px solid rgba(224,196,138,.22); padding:10px 12px; }
.clue header { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--brass-bright); }
.warn { border-left:3px solid var(--oxblood); padding-left:12px; }
.search { margin:8px 0 14px; }
@media (max-width:860px) {
  .consult, .split { grid-template-columns:1fr; }
  .top { padding:12px 14px; gap:10px; }
  main { padding:22px 14px 56px; }
  .paper { padding:22px 16px; }
  .rowitem { grid-template-columns:1fr; gap:4px; }
  .hero { flex-direction:column; gap:8px; }
  .vlabel { writing-mode:horizontal-tb; letter-spacing:.28em; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior:auto; }
  * { transition:none !important; animation:none !important; }
}
@media print {
  body { background:white; color:black; }
  .top, .foot, .noprint { display:none !important; }
  .paper { box-shadow:none; }
}
</style>
</head>
<body>
<a class='skip' href='#main'>本文へ</a>
<header class='top'>
  <a class='brand' href='#/'>
    <svg class='mark' viewBox='0 0 64 64' aria-hidden='true'>
      <circle cx='32' cy='32' r='18' fill='none' stroke='#e0c48a' stroke-width='1.4'/>
      <path d='M32 8 V56' stroke='#e0c48a' stroke-width='1.2'/>
      <path d='M14 32 H22 M42 32 H50' stroke='#e0c48a' stroke-width='1.2'/>
    </svg>
    <span><small>CONSULTING ROOM</small><strong>慧眼</strong></span>
  </a>
  <nav aria-label='主な導線'>
    <a href='#/consult' data-nav='consult'>相談室</a>
    <a href='#/cases' data-nav='cases'>事件簿</a>
    <a href='#/compendium' data-nav='compendium'>博物誌</a>
    <a href='#/board' data-nav='board'>推論盤</a>
  </nav>
</header>
<main id='main'><div id='app'></div></main>
<footer class='foot'>慧眼は、あらかじめ編まれた知識と計算、そして消去の作法で意見書を作る。世界のすべてを知っているふりはしない。顧問探偵 黒樫 慧（くろがし けい）。十七号室。</footer>
<noscript><p class='paper' style='margin:22px'>この鑑定室はスクリプトを使う。無効にしているなら、有効にして開き直してほしい。</p></noscript>
<script src='data.js'></script>
<script src='app.js'></script>
</body>
</html>
